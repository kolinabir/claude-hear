<!doctype html>
<html><head><meta charset="utf-8"></head>
<body><pre id="out">rendering</pre>
<script type="module">
// Renders the logged sound calls (from capture.html?log=1) with the site's own synth into a WAV, offline.
import { createSfx } from "../../docs/sfx.js";
const log = await (await fetch("./sfx-log.json")).json();
const SR = 48000, dur = Math.ceil(log.t) + 1;
const ctx = new OfflineAudioContext(2, SR * dur, SR);
let cur = 0;
const sfx = createSfx({ ctx, now: () => cur, on: true });
for (const [name, args, t] of log.log) {
  if (name === "set" || name === "level" || typeof sfx[name] !== "function") continue;
  cur = t;
  try { sfx[name](...args); } catch (e) { console.error(name, e); }
}
const buf = await ctx.startRendering();
// WAV encode (16-bit PCM)
const n = buf.length, ch = buf.numberOfChannels, data = new DataView(new ArrayBuffer(44 + n * ch * 2));
const str = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
str(0, "RIFF"); data.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVE"); str(12, "fmt "); data.setUint32(16, 16, true);
data.setUint16(20, 1, true); data.setUint16(22, ch, true); data.setUint32(24, SR, true); data.setUint32(28, SR * ch * 2, true);
data.setUint16(32, ch * 2, true); data.setUint16(34, 16, true); str(36, "data"); data.setUint32(40, n * ch * 2, true);
let o = 44;
for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, buf.getChannelData(c)[i])); data.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); o += 2; }
const bytes = new Uint8Array(data.buffer); let s = "";
for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
document.getElementById("out").textContent = "WAV:" + btoa(s);
</script></body></html>
