<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
html, body { margin: 0; overflow: hidden; background: #ffffff; }
body { width: var(--w); height: var(--h); position: relative; font-family: "Instrument Sans", sans-serif; color: #0b1020; }
main { position: absolute; inset: 0; }
#mascot { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); transform: translate(-50%, -54%); }
.cap { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; letter-spacing: -.045em; line-height: .95; opacity: 0; transform: translateY(14px); transition: opacity .35s, transform .35s; padding: 0 60px; }
.cap.on { opacity: 1; transform: none; }
.cap em { font-style: normal; color: #1fb257; }
#top { top: 7%; font-size: var(--big); }
#bottom { bottom: 7%; font-size: var(--small); font-weight: 600; letter-spacing: -.02em; color: #4b5b7c; }
#bottom em { color: #7cb0ff; font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: 0; }
#lines { position: absolute; left: 0; right: 0; bottom: 8%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#lines div { font: 500 var(--mono) "JetBrains Mono", monospace; color: #0b1020; background: #f3f5fa; border: 1px solid #d9deea; border-radius: 999px; padding: 12px 22px; opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; }
#lines div.on { opacity: 1; transform: none; }
#lines b { font-weight: 700; } #lines .s1 { color: #0a8fd6; font-weight: 700; } #lines .s2 { color: #1fb257; font-weight: 700; } #lines .q { color: #8a93a8; } #lines .m { color: #d9772b; } #lines .e { color: #d64545; }
#end { position: absolute; inset: 0; background: #ffffff; opacity: 0; transition: opacity .4s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
#end.on { opacity: 1; }
#end h1 { margin: 0; font-size: var(--big); letter-spacing: -.05em; line-height: .95; text-align: center; }
#end h1 em { font-style: normal; color: #1fb257; }
#end p { margin: 0; font-size: var(--small); color: #4b5b7c; }
#end code { font: 500 var(--mono) "JetBrains Mono", monospace; color: #0a8fd6; background: #f3f5fa; padding: 10px 18px; border-radius: 10px; }
#glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(60% 60% at 50% 50%, rgba(131,253,128,.55), rgba(0,211,251,.25) 50%, transparent 75%); transition: opacity .5s; }
#glow.on { opacity: 1; }
main.quake { animation: quake .5s; } main.quake-big { animation: quake 1.1s; }
@keyframes quake { 10% { transform: translate(-8px, 6px) rotate(-.4deg); } 30% { transform: translate(7px, -5px) rotate(.3deg); } 50% { transform: translate(-5px, 4px); } 70% { transform: translate(4px, -3px); } 90% { transform: translate(-2px, 2px); } }
</style></head>
<body>
<main>
  <div id="glow"></div>
  <canvas id="mascot"></canvas>
  <div class="cap" id="top"></div>
  <div class="cap" id="bottom"></div>
  <div id="lines"></div>
</main>
<div id="end"><h1>We gave<br>Claude <em>ears.</em></h1><p>a free Claude Code skill</p><code>npx skills add kolinabir/claude-hear --skill hear</code></div>
<script>
// deterministic randomness, so the video can be rendered in chunks (fresh browser per chunk) without visible seams
(function () { let a = 0x9e3779b9; Math.random = function () { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
</script>
<script type="module">
import { createMascot } from "../../docs/mascot.js";
import { createSfx } from "../../docs/sfx.js";
const q = new URLSearchParams(location.search), W = +q.get("w") || 1080, H = +q.get("h") || 1080;
const R = document.documentElement.style;
R.setProperty("--w", W + "px"); R.setProperty("--h", H + "px");
R.setProperty("--s", Math.min(W, H * 0.62) + "px");
R.setProperty("--big", (W / 1080 * 92) + "px"); R.setProperty("--small", (W / 1080 * 34) + "px"); R.setProperty("--mono", (W / 1080 * 24) + "px");

// every sound call is logged with its (virtual) time, so a second pass can render the audio offline
const real = createSfx(), log = [];
let T0 = 0;   // the timeline's start, so logged times are relative to it
const sfx = new Proxy(real, { get(t, k) { const v = t[k]; return typeof v === "function" ? (...a) => { log.push([k, a, (performance.now() - T0) / 1000]); return v.apply(t, a); } : v; } });
window.sfxLog = log;
const canvas = document.getElementById("mascot");
const m = createMascot(canvas, { sfx, earless: true });
window.hearMascot = m;

const top = document.getElementById("top"), bottom = document.getElementById("bottom"), lines = document.getElementById("lines"), end = document.getElementById("end"), glow = document.getElementById("glow");
const show = (el, html) => { el.innerHTML = html; el.classList.add("on"); };
const hide = el => el.classList.remove("on");
const at = (ms, fn) => setTimeout(fn, ms);
addEventListener("hear:charge", () => glow.classList.add("on"));
addEventListener("hear:burst", () => at(600, () => glow.classList.remove("on")));

// 2D effects at the meteor hit: flash, shock ring, cracks, debris (trimmed from the site)
const fx = (() => {
  const DPR = devicePixelRatio || 1;
  const cv = document.createElement("canvas"); cv.width = W * DPR; cv.height = H * DPR;
  Object.assign(cv.style, { position: "absolute", inset: "0", width: W + "px", height: H + "px", pointerEvents: "none" });
  document.querySelector("main").appendChild(cv);
  const g = cv.getContext("2d"); g.scale(DPR, DPR); const rings = [], cracks = [], shards = [], flashes = [];
  let raf = 0;
  const tick = () => {
    raf = 0; g.clearRect(0, 0, W, H); const now = performance.now();
    g.globalCompositeOperation = "source-over";
    for (let i = flashes.length - 1; i >= 0; i--) { const f = flashes[i], k = (now - f.t) / 420; if (k >= 1) { flashes.splice(i, 1); continue; }
      const r = f.r * (0.4 + k * 0.8), gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      gr.addColorStop(0, `rgba(255,214,120,${1 - k})`); gr.addColorStop(0.35, `rgba(31,178,87,${(1 - k) * 0.6})`); gr.addColorStop(1, "rgba(31,178,87,0)");
      g.fillStyle = gr; g.beginPath(); g.arc(f.x, f.y, r, 0, Math.PI * 2); g.fill(); }
    for (let i = rings.length - 1; i >= 0; i--) { const w = rings[i], k = (now - w.t) / w.dur; if (k >= 1) { rings.splice(i, 1); continue; }
      g.strokeStyle = `rgba(31,178,87,${(1 - k) * 0.85})`; g.lineWidth = 14 * (1 - k) + 1; g.beginPath(); g.arc(w.x, w.y, w.max * (1 - (1 - k) ** 3), 0, Math.PI * 2); g.stroke(); }
    g.globalCompositeOperation = "source-over";
    for (let i = cracks.length - 1; i >= 0; i--) { const c = cracks[i], age = (now - c.t) / 1000; if (age > 1.5) { cracks.splice(i, 1); continue; }
      const grow = Math.min(1, age / 0.18), fade = age < 0.9 ? 1 : 1 - (age - 0.9) / 0.6, n = Math.max(2, Math.floor(c.pts.length * grow));
      g.lineCap = "round"; g.lineJoin = "round";
      for (const [col, lw] of [[`rgba(31,178,87,${0.35 * fade})`, 5], [`rgba(11,16,32,${0.9 * fade})`, 1.4]]) { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); c.pts.slice(0, n).forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); } }
    for (let i = shards.length - 1; i >= 0; i--) { const d = shards[i]; d.vy += 0.42; d.x += d.vx; d.y += d.vy; d.a += d.va; if (d.y > H + 40) { shards.splice(i, 1); continue; }
      g.save(); g.translate(d.x, d.y); g.rotate(d.a); g.fillStyle = d.c; g.beginPath(); g.moveTo(-d.s, -d.s * 0.4); g.lineTo(d.s * 0.7, -d.s * 0.7); g.lineTo(d.s * 0.4, d.s * 0.8); g.closePath(); g.fill(); g.restore(); }
    if (rings.length || cracks.length || shards.length || flashes.length) raf = requestAnimationFrame(tick);
  };
  const run = () => { if (!raf) raf = requestAnimationFrame(tick); };
  const crackFrom = (x, y, count, len) => { for (let i = 0; i < count; i++) { let a = (i / count) * Math.PI * 2 + Math.random() * 0.6, px = x, py = y; const pts = [[px, py]], steps = 9 + Math.floor(Math.random() * 6), seg = len / steps;
    for (let k = 0; k < steps; k++) { a += (Math.random() - 0.5) * 0.7; px += Math.cos(a) * seg; py += Math.sin(a) * seg; pts.push([px, py]); } cracks.push({ pts, t: performance.now() }); } };
  const debris = (x, y, n, power) => { const cols = ["#c4583a", "#e07a55", "#1fb257", "#0b1d44", "#d9772b"]; for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = power * (0.4 + Math.random());
    shards.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.6, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, s: 3 + Math.random() * 7, c: cols[Math.floor(Math.random() * cols.length)] }); } };
  const quake = big => { if (q.get("noquake")) return; const el = document.querySelector("main"); el.classList.remove("quake", "quake-big"); void el.offsetWidth; el.classList.add(big ? "quake-big" : "quake"); };
  return {
    impact(x, y) { if (q.get("nofx")) { at(80, () => m.crackSound()); return; } flashes.push({ x, y, r: 220, t: performance.now() }); rings.push({ x, y, max: Math.hypot(W, H), dur: 900, t: performance.now() }); crackFrom(x, y, 9, 260); debris(x, y, 46, 9); quake(false); at(80, () => m.crackSound()); run(); },
    blasts() { if (q.get("nofx")) return; for (let i = 0; i < 4; i++) at(200 + i * 360, () => { const x = W * (0.08 + Math.random() * 0.84), y = H * (0.1 + Math.random() * 0.8);
        flashes.push({ x, y, r: 120 + Math.random() * 120, t: performance.now() }); rings.push({ x, y, max: 260 + Math.random() * 200, dur: 650, t: performance.now() }); crackFrom(x, y, 4 + Math.floor(Math.random() * 3), 120 + Math.random() * 110); debris(x, y, 18, 7); if (i % 2 === 0) m.blastSound(); else m.crackSound(); run(); });
      rings.push({ x: W / 2, y: H / 2, max: Math.hypot(W, H) * 1.1, dur: 1100, t: performance.now() }); quake(true); run(); },
    meteor(onHit) {
      const r = canvas.getBoundingClientRect(), sx = -80, sy = -80, tx = r.left + r.width * 0.43, ty = r.top + r.height * 0.42, DUR = 1150, trail = [], sparks = [];
      const cv2 = document.createElement("canvas"); cv2.width = W * DPR; cv2.height = H * DPR; Object.assign(cv2.style, { position: "absolute", inset: "0", width: W + "px", height: H + "px", pointerEvents: "none" }); document.querySelector("main").appendChild(cv2);
      const g2 = cv2.getContext("2d"); g2.scale(DPR, DPR); m.meteorSound(DUR / 1000);
      let t0 = null, hit = false, hitAt = 0;
      const frame = now => {
        if (t0 == null) t0 = now;
        const k = Math.min(1, (now - t0) / DUR), e = k * k * (3 - 2 * k) * 0.25 + k * k * 0.75, x = sx + (tx - sx) * e, y = sy + (ty - sy) * e - Math.sin(k * Math.PI) * 40;
        g2.clearRect(0, 0, W, H); g2.globalCompositeOperation = "source-over";
        if (!hit) { trail.push([x, y]); if (trail.length > 26) trail.shift(); for (let i = 0; i < 3; i++) sparks.push({ x, y, vx: (Math.random() - 0.7) * 4, vy: (Math.random() - 0.7) * 4, life: 1 }); }
        trail.forEach(([px, py], i) => { const a = i / trail.length; g2.fillStyle = `rgba(31,178,87,${a * 0.5})`; g2.beginPath(); g2.arc(px, py, 3 + a * 16, 0, Math.PI * 2); g2.fill(); });
        sparks.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.035; });
        for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; if (p.life <= 0) { sparks.splice(i, 1); continue; } g2.fillStyle = `rgba(217,119,43,${p.life * 0.8})`; g2.fillRect(p.x, p.y, 2.5, 2.5); }
        if (!hit) { const head = g2.createRadialGradient(x, y, 0, x, y, 34); head.addColorStop(0, "rgba(255,240,180,1)"); head.addColorStop(0.3, "rgba(255,170,60,.95)"); head.addColorStop(1, "rgba(31,178,87,0)"); g2.fillStyle = head; g2.beginPath(); g2.arc(x, y, 34, 0, Math.PI * 2); g2.fill();
          // the skill itself, riding the meteor: a file chip "SKILL.md · hear"
          const label = "SKILL.md", fs = Math.round(W / 1080 * 26); g2.font = `700 ${fs}px "JetBrains Mono", monospace`; const tw = g2.measureText(label).width, pw = tw + fs * 1.4, ph = fs * 1.9, px = x + 30, py = y - ph / 2 - 26;
          g2.fillStyle = "rgba(11,16,32,.92)"; g2.beginPath(); g2.roundRect(px, py, pw, ph, ph / 2); g2.fill();
          g2.fillStyle = "#83fd80"; g2.textBaseline = "middle"; g2.fillText(label, px + fs * 0.7, py + ph / 2 + 1); }
        if (k >= 1 && !hit) { hit = true; hitAt = now; trail.length = 0; const white = document.createElement("div"); if (q.get("noflash")) white.style.display = "none"; Object.assign(white.style, { position: "absolute", inset: "0", background: "#ffe08a", opacity: ".85", pointerEvents: "none" }); document.querySelector("main").appendChild(white); requestAnimationFrame(() => requestAnimationFrame(() => white.remove())); onHit(); fx.impact(tx, ty); fx.blasts(); }
        if (hit) { const h = (now - hitAt) / 380; g2.strokeStyle = `rgba(31,178,87,${Math.max(0, 1 - h)})`; g2.lineWidth = 6 * (1 - h) + 1; g2.beginPath(); g2.arc(tx, ty, 20 + h * 160, 0, Math.PI * 2); g2.stroke(); if (h >= 1 && !sparks.length) { cv2.remove(); return; } }
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    },
  };
})();

// the timeline (ms). With ?hold=1 it waits for window.start() (the sound-log capture steps virtual time itself)
function start() {
T0 = performance.now();
document.body.style.background = "#000"; document.querySelector("main").style.visibility = "hidden"; at(50, () => { document.body.style.background = ""; document.querySelector("main").style.visibility = ""; });
at(200, () => show(top, "Claude can read.<br>Claude can see."));
at(1900, () => { show(top, "Claude <em>can't hear.</em>"); m.listen(); });
at(2300, () => m.word({ text: "...", end: 3.1, emo: null, spk: "S1" }));
at(3700, () => { hide(top); m.end(); });
at(4000, () => { m.prepare(); show(top, "Then a <em>skill</em> landed."); at(450, () => fx.meteor(() => { m.impact(); at(900, () => hide(top)); })); });
const lineHtml = [
  '<span class="s1">S1</span> Hey<span class="m">↑</span> Claude, can you<span class="m">↑</span> hear<span class="m">↑</span> me?',
  '<span class="s2">S2</span> Wait, since when does it have ears?',
  '<span class="s1">S1</span> <span class="q">(It) (even) (knows) (when) (I) (whisper.)</span>',
  '<span class="s2">S2</span> Okay, ‖0.5s‖ that\'s terrifying.<span class="m">↓</span> <span class="e">{fearful}</span>',
];
const LINE_GAP = 2300;   // the real clip's lines play under these, so they need room
addEventListener("hear:ready", () => {
  log.push(["ready", [], (performance.now() - T0) / 1000]);
  show(top, "Now it <em>can.</em>");
  lineHtml.forEach((h, i) => at(700 + i * LINE_GAP, () => { const d = document.createElement("div"); d.innerHTML = h; lines.appendChild(d); requestAnimationFrame(() => d.classList.add("on")); m.boop && i === 3 && m.boop(); }));
  at(700 + 3 * LINE_GAP + 2600, () => { end.classList.add("on"); });
  // ?log=1: after the end card, replace the page with the sound log (read back with --dump-dom to render the audio offline)
});
}
window.start = start;
if (!q.get("hold")) start();
</script>
</body></html>
